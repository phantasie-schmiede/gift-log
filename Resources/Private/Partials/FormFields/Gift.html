<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_gift_log/Resources/Private/Language/Backend/Configuration/TCA/gift.xlf" />
<psbFoundation:translation.registerLanguageFile file="EXT:psb_gift_log/Resources/Private/Language/Frontend/eventGiftRelation.xlf" />

<f:asset.script
    identifier="autoSizeTextArea"
    src="EXT:psb_templates/Resources/Public/JavaScript/autoSizeTextArea.js"
    type="module" />
<f:asset.script
    identifier="clearInput"
    src="EXT:psb_templates/Resources/Public/JavaScript/clearInput.js"
    type="module" />
<f:asset.script
    identifier="copyContent"
    src="EXT:psb_templates/Resources/Public/JavaScript/copyContent.js"
    type="module" />
<f:asset.script
    identifier="inputAutocomplete"
    src="EXT:psb_templates/Resources/Public/JavaScript/inputAutocomplete.js"
    type="module" />

<div
    class="accordion accordion-flush mb-3"
    id="accordionEventGiftRelation">
    <f:if condition="{preselectedEvent}">
        <f:then>
            <f:render
                arguments="{_all}"
                partial="FormFields/EventGiftRelation" />
        </f:then>
        <f:else>
            <f:for
                as="record"
                each="{gift.events}">
                <f:render
                    arguments="{_all}"
                    partial="FormFields/EventGiftRelation" />
            </f:for>
        </f:else>
    </f:if>
</div>

<div class="mb-3">
    <span
        class="bg-secondary-subtle btn"
        data-psb-copy-mode="append"
        data-psb-copy-source="#templateEventGiftRelation"
        data-psb-copy-target="#accordionEventGiftRelation">
        <psbFoundation:translate id="eventGiftRelation:addEvent" />
    </span>
</div>

<div class="form-floating mb-3">
    <input
        autocomplete="off"
        class="form-control psb-templates-clear-input"
        data-psb-autocomplete-items="{allContacts}"
        data-psb-autocomplete-preselection="{preselectedDonors}"
        data-psb-autocomplete-selection-target="#gift-donors-selection"
        data-psb-autocomplete-value-target="#gift-donors-value"
        placeholder="{psbFoundation:translate(id: 'gift:donors')}"
        type="text" />
    <label
        class="form-label">
        <psbFoundation:translate id="gift:donors" />
    </label>
    <ul
        class="list-group list-group-flush"
        id="gift-donors-selection">
    </ul>
    <f:form.hidden
        id="gift-donors-value"
        name="gift[donors]" />
</div>

<div class="form-floating mb-3">
    <input
        autocomplete="off"
        class="form-control psb-templates-clear-input"
        data-psb-autocomplete-items="{allContacts}"
        data-psb-autocomplete-preselection="{preselectedRecipients}"
        data-psb-autocomplete-selection-target="#gift-recipients-selection"
        data-psb-autocomplete-value-target="#gift-recipients-value"
        placeholder="{psbFoundation:translate(id: 'gift:recipients')}"
        type="text" />
    <label
        class="form-label">
        <psbFoundation:translate id="gift:recipients" />
    </label>
    <ul
        class="list-group list-group-flush"
        id="gift-recipients-selection">
    </ul>
    <f:form.hidden
        id="gift-recipients-value"
        name="gift[recipients]" />
</div>

<div class="form-floating mb-3">
    <f:form.textarea
        class="form-control psb-templates-auto-size"
        property="description"
        placeholder="{psbFoundation:translate(id: 'gift:description')}"
        value="{gift.description}" />
    <label
        class="form-label">
        <psbFoundation:translate id="gift:description" />
    </label>
</div>

<div class="form-floating mb-3">
    <f:form.textarea
        class="form-control psb-templates-auto-size"
        property="notes"
        placeholder="{psbFoundation:translate(id: 'gift:notes')}"
        value="{gift.notes}" />
    <label
        class="form-label">
        <psbFoundation:translate id="gift:notes" />
    </label>
</div>
</html>
