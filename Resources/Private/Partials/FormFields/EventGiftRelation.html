<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_gift_log/Resources/Private/Language/Backend/Configuration/TCA/eventGift.xlf" />
<psbFoundation:translation.registerLanguageFile file="EXT:psb_gift_log/Resources/Private/Language/Frontend/eventGiftRelation.xlf" />

<f:asset.script
    identifier="deleteContent"
    src="EXT:psb_templates/Resources/Public/JavaScript/deleteContent.js"
    type="module" />

<f:if condition="{record}">
    <f:then>
        <f:variable
            name="uid"
            value="{record.uid}" />
    </f:then>
    <f:else>
        <f:variable
            name="uid"
            value="###uid###" />
    </f:else>
</f:if>

<div class="form-floating mb-3">
    <f:form.select
        class="form-select"
        optionLabelField="label"
        optionValueField="value"
        options="{events}"
        name="eventGiftRelation[{uid}][event]"
        value="{record.event}">
    </f:form.select>
    <label
        class="form-label">
        <psbFoundation:translate id="eventGift:event" />
    </label>
</div>

<div class="form-floating mb-3">
    <f:form.textfield
        class="form-control"
        name="eventGiftRelation[{uid}][year]"
        placeholder="{psbFoundation:translate(id: 'eventGift:year')}"
        type="number"
        value="{record.year -> f:or(alternative: '{f:format.date(date: \'now\', format: \'Y\')}')}" />
    <label
        class="form-label">
        <psbFoundation:translate id="eventGift:year" />
    </label>
</div>

<div
    class="btn btn-danger"
    data-psb-delete-mode="closest"
    data-psb-delete-target=".accordion-item">
    <psbFoundation:translate id="eventGiftRelation:remove" />
</div>
</html>
