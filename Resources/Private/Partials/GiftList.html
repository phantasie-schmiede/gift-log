<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers"
    xmlns:templates="http://typo3.org/ns/PSBits/Templates/ViewHelpers">
<foundation:translation.registerLanguageFile file="EXT:gift_log/Resources/Private/Language/Frontend/giftList.xlf" />

<f:if condition="{giftRelationsGroupedByYear}">
    <f:then>
        <f:for
            as="giftRelationGroups"
            each="{giftRelationsGroupedByYear}"
            key="year">
            <h2 class="align-items-center d-flex">
                <templates:svgIcon
                    height="24"
                    identifier="templates-calendar-range"
                    width="24" />
                <span class="ms-2">
                    {year}
                </span>
            </h2>
            <div class="mb-4">
                <f:for
                    as="giftRelationGroup"
                    each="{giftRelationGroups}">
                    <h3 class="mt-3">
                        {giftRelationGroup.label}
                    </h3>

                    <f:render
                        arguments="{
                            configuration: {
                                autoHeight: true,
                                breakpoints: {
                                    576: {
                                        slidesPerView: 2,
                                        spaceBetween: 20
                                    },
                                    768: {
                                        slidesPerView: 3,
                                        spaceBetween: 30
                                    },
                                    1200: {
                                        slidesPerView: 4,
                                        spaceBetween: 40
                                    }
                                },
                                breakpointsBase: 'container',
                                navigation: true,
                                pagination: {
                                    clickable: true
                                },
                                slidesPerView: 1,
                                spaceBetween: 10
                            },
                            id: 'gift-images',
                        }"
                        contentAs="slides"
                        partial="Component/Swiper">

                        <f:variable
                            name="giftRelationGroupCount"
                            value="{giftRelationGroup.relations -> f:count()}" />

                        <f:for
                            as="giftRelation"
                            each="{giftRelationGroup.relations}">
                            <f:variable
                                name="gift"
                                value="{giftRelation.gift}" />
                            <div class="swiper-slide">
                                <div class="card h-100">
                                    <f:if condition="{gift.images}">
                                        <f:image
                                            class="card-img-top h-auto"
                                            image="{gift.images.0}" />
                                    </f:if>

                                    <div class="card-body pb-4">
                                        <h5 class="card-title">
                                            <f:format.nl2br>{gift.description}</f:format.nl2br>
                                        </h5>
                                        <p class="card-text">
                                            Von: {gift.donorList}

                                            <f:if condition="{gift.recipientList} != {contactEvent.contactsAsEnumeration}">
                                                <br>
                                                An: {gift.recipientList}
                                            </f:if>
                                        </p>

                                        <f:if condition="{gift.notes}">
                                            <p class="card-text">
                                                {gift.notes}
                                            </p>
                                        </f:if>
                                    </div>

                                    <f:link.action
                                        action="edit"
                                        arguments="{contact: contact, contactEvent: contactEvent, gift: gift, giftLogEvent: giftLogEvent}"
                                        class="stretched-link"
                                        controller="Gift">
                                    </f:link.action>
                                </div>
                            </div>
                        </f:for>
                    </f:render>
                </f:for>
            </div>
        </f:for>
    </f:then>
    <f:else>
        <div class="alert alert-info text-center">
            <foundation:translate id="giftList:noGifts" />
        </div>
    </f:else>
</f:if>
</html>
