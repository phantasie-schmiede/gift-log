<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers">
<h1 class="mb-3 text-center">
    <foundation:translate
        arguments="{anniversary: event.nextAnniversary, persons: event.contactsAsEnumeration}"
        id="{f:if(condition: event.nextAnniversary, then: 'giftsForEvent.{event.type.value}.anniversary', else: 'giftsForEvent.{event.type.value}')}" />
</h1>

<f:render
    arguments="{contactEvent: contactEvent, giftLogEvent: giftLogEvent, giftRelationsGroupedByYear: giftRelationsGroupedByYear}"
    partial="GiftList" />

<f:link.action
    action="new"
    arguments="{contactEvent: contactEvent, giftLogEvent: giftLogEvent}"
    class="bg-primary-subtle btn mt-3"
    controller="Gift"
    pluginName="Gift">
    <core:icon
        identifier="psb-templates-plus-lg"
        size="small" />
    <foundation:translate id="enterNewGift" />
</f:link.action>
</html>
