<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers">
<foundation:translation.registerLanguageFile file="EXT:gift_log/Resources/Private/Language/Frontend/eventGiftRelation.xlf" />

<f:variable
    name="preselectedEvent"
    value="{contactEvent -> f:or(alternative: giftLogEvent)}" />

<f:form
    action="create"
    arguments="{contactEvent: contactEvent, giftLogEvent: giftLogEvent}"
    enctype="multipart/form-data"
    method="post"
    name="gift"
    object="{gift}">
    <f:render
        arguments="{_all}"
        partial="FormFields/Gift" />

    <div class="col-12 mt-3">
        <f:link.action
            action="listForEvent"
            arguments="{contactEvent: contactEvent, giftLogEvent: giftLogEvent}"
            class="bg-secondary-subtle btn"
            controller="History">
            <foundation:translate id="cancel" />
        </f:link.action>
        <button
            class="bg-primary-subtle btn"
            type="submit">
            <foundation:translate id="save" />
        </button>
    </div>
</f:form>

<div
    class="d-none"
    id="templateEventGiftRelation">
    <f:render
        arguments="{_all}"
        partial="FormFields/EventGiftRelation" />
</div>
</html>
