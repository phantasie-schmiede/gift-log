<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<f:form
    action="create"
    arguments="{contactEvent: contactEvent, giftLogEvent: giftLogEvent}"
    enctype="multipart/form-data"
    method="post"
    name="gift"
    object="{gift}">
    <f:render
        arguments="{_all}"
        partial="FormFields/Gift" />

    <div class="col-12 mt-3">
        <f:link.action
            action="listForEvent"
            arguments="{contactEvent: contactEvent, giftLogEvent: giftLogEvent}"
            class="bg-secondary-subtle btn"
            controller="History">
            <psbFoundation:translate id="cancel" />
        </f:link.action>
        <button
            class="bg-primary-subtle btn"
            type="submit">
            <psbFoundation:translate id="save" />
        </button>
    </div>
</f:form>
</html>
