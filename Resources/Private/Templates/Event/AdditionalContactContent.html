<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Frontend/Contact/show.xlf" />

<f:if condition="{gifts}">
    <dt class="col-3">Geschenke</dt>
    <dd class="col-9">
        <ul>
            <f:for
                as="gift"
                each="{gifts}">
                <li>
                    <strong>
                        <f:for
                            as="event"
                            each="{gift.events}"
                            iteration="eventIterator">
                            <f:if condition="{event.name}">
                                <f:then>
                                    <strong>{event.name}</strong><f:if condition="!{eventIterator.isLast}">,</f:if>
                                </f:then>
                                <f:else>
                                    <psbFoundation:translate
                                        default="{event.label}"
                                        id="show:event.type.{event.label}" /><f:if condition="!{eventIterator.isLast}">,</f:if>
                                </f:else>
                            </f:if>
                        </f:for>
                        {gift.year}
                    </strong>
                    von <f:for as="donor" each="{gift.donors}">{donor.displayName}</f:for>:
                    <span>{gift.description}</span>
                </li>
            </f:for>
        </ul>
    </dd>
</f:if>
</html>
