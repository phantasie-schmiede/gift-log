<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers">
<f:if condition="{gifts}">
    <h3 class="mt-3">Geschenke</h3>
    <f:link.action
        action="listForContact"
        arguments="{contact: contact}"
        controller="History"
        extensionName="GiftLog"
        pluginName="History">
        <foundation:translate id="showAllGifts" />
        Alle anzeigen
    </f:link.action>
</f:if>
</html>
